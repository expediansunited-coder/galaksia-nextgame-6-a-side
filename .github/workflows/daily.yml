name: 6-a-side Next Matches

on:
  schedule:
    - cron: '0 8 * * 2'   # Tue ~10:00 Prague summer / 09:00 winter
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secret files
        run: |
          echo '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.META_CONFIG_6ASIDE_JSON }}' > meta_config_6aside.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Run script
        run: python "next match 6-a-side.py"
