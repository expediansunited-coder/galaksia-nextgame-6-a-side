name: 6-a-side Next Matches

on:
  schedule:
    - cron: '0 8 * * 2'   # Tue ~10:00 Prague summer / 09:00 winter
  workflow_dispatch:

permissions:
  contents: write        # allow the workflow to commit the images back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secret files
        run: |
          echo '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.META_CONFIG_6ASIDE_JSON }}' > meta_config_6aside.json

      - name: Generate images
        run: python "next match 6-a-side.py" --generate-only

      - name: Commit generated images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/*.png
          git commit -m "Add generated match images" || echo "nothing to commit"
          git push

      - name: Post to Meta
        run: python "next match 6-a-side.py" --post-only
